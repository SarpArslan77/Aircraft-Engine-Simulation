
#* .github/workflows/verilator.yml

name: Verilator Semantic Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verilator:
    name: Verilator RTL Lint (-Wall)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
    
      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator #TODO apt / get / -y

      - name: Check Verilator Version
        run: verilator --version

      - name: Lint RTL with strict DO-254 rules
        run: |
          verilator --lint-only -Wall -Irtl rtl/aircraft_engine_simulator_top.v #TODO Can i not make this absolute path? or does it have to be this way
