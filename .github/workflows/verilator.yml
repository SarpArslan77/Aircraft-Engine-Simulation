
#* .github/workflows/verilator.yml

name: Verilator Semantic Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verilator:
    name: Verilator RTL Lint (-Wall)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for RTL Changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rtl:
              - "rtl/**.v"
              - "rtl/**.vh"
              - ".rules.verible_lint"
    
      - name: Install Verilator
        if: steps.filter.outputs.rtl == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator #TODO apt / get / -y

      - name: Check Verilator Version
        if: steps.filter.outputs.rtl == 'true' || github.event_name == 'workflow_dispatch'
        run: verilator --version

      #TODO AC / Can i not make this absolute path? or does it have to be this way
      - name: Lint RTL with strict DO-254 rules
        if: steps.filter.outputs.rtl == 'true' || github.event_name == 'workflow_dispatch'
        run: | 
          verilator --lint-only -Wall \
            -Wwarn-style \
            -Werror-WIDTH \
            -Werror-UNOPTFLAT \
            -Werror-CASEINCOMPLETE \
            -Werror-LATCH \
            -Irtl rtl/aircraft_engine_simulator_top.v