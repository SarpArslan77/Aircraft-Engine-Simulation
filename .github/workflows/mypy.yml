
#* .github/workflows/mypy.yml

name: Mypy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mypy:
    name: Mypy Type Checking
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check for Python Changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - "scripts/**.py"
              - "sim_model/**.py"
              - ".ruff.toml"
              - "main.py"
              - "pyproject.toml"
              - "requirements.txt"

      - name: Set up Python
        if: steps.filter.outputs.python == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
    
      - name: Install Dependencies
        if: steps.filter.outputs.python == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python -m pip install --upgrade pip
          pip install mypy
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Mypy
        if: steps.filter.outputs.python == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          mypy --config-file pyproject.toml scripts sim_model tb main.py