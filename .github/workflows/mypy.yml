
#* .github/workflows/mypy.yml

name: Mypy

on:
  push:
    branches: [main]
    paths:
      - "scripts/**.py"
      - "sim_model/**.py"
      - ".ruff.toml"
      - "main.py"
      - "pyproject.toml"
      - "requirements.txt"
  pull_request:
    branches: [main]
    paths:
      - "scripts/**.py"
      - "sim_model/**.py"
      - ".ruff.toml"
      - "main.py"
      - "pyproject.toml"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mypy:
    name: Mypy Type Checking
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
    
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Mypy
        run: |
          mypy --config-file pyproject.toml scripts sim_model tb main.py