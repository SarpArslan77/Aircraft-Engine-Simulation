
#* .ruff.toml

#* ======= Tom's Obvious, Minimal Language (TOML) =======
# Human-readable format for storing structured configuration data.

#? line-length: Sets the configured maximum line length.
line-length = 100
#? target-version: Tells Ruff to target this Python version.
target-version = "py310"

#? extend-exclude: Tells Ruff to skip matching files and directories.
# Ignores generated simulation files.
extend-exclude = [
    ".venv",
    ".vscode",
    ".Xil",
    "build_synth",
    "docs",
    "sim_build"
]

#? [lint]: Declares a TOML table.
[lint]
#? select: Tells Ruff which categories of lint rules to enable.
# Starts with Ruff's core error and undefined checks.
select = [
    "E4", "E7", "E9", "F",
    "C90", # Cyclomatic complexity.
    "PLR0915", # Too many statements in a function.
    "PLR0912" # Too many branches.
]

[lint.mccabe]
# Restricts code to simple control flow (no spaghetti jumps / branches).
max-complexity = 7

[lint.pylint]
# No function longer than 60 lines.
max-statements = 50
max-branches = 6